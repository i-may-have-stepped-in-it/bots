apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jennifer-data
  namespace: jennifer
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jennifer-logs
  namespace: jennifer
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jennifer-nltk
  namespace: jennifer
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi

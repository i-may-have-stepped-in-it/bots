name: Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.py'
      - 'requirements*.txt'
      - 'pytest.ini'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.py'
      - 'requirements*.txt'
      - 'pytest.ini'
      - '.github/workflows/tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Create necessary directories
      run: |
        mkdir -p config data logs tests/temp

    - name: Create test config
      run: |
        echo '{
          "Name": "TestJennifer",
          "DiscordToken": "test-token",
          "LogLevel": "DEBUG"
        }' > config/config.json

    - name: Lint with flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,__pycache__,.git
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics --exclude=venv,__pycache__,.git

    - name: Check formatting with black
      run: |
        black --check --diff --exclude='venv|__pycache__' . || true

    - name: Run unit tests
      run: |
        pytest tests/unit -v --tb=short --timeout=60 -m "not slow"

    - name: Run tests with coverage
      run: |
        pytest --cov=core --cov=utils --cov=bot --cov-report=xml --cov-report=term -v --tb=short

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  integration:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Create necessary directories
      run: |
        mkdir -p config data logs

    - name: Run integration tests
      run: |
        pytest tests/integration -v --tb=short -m "integration" || true
      continue-on-error: true

[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    discord: marks tests that require discord.py
    config: marks configuration-related tests
    queue: marks queue-related tests
    unit: marks unit tests

# Warnings filter
filterwarnings =
    ignore::DeprecationWarning:discord.*:
    ignore::DeprecationWarning:aiosqlite.*:

# Coverage configuration
cov = .
cov-report = term-missing
cov-fail-under = 70

# Test output
verbose = 1
tb = short
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

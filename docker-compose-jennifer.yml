name: jennifer

services:
  init:
    image: busybox
    volumes:
      - ./config:/app/config  # Mount the ./config directory on the host to /app/config in the container
    command: chown -R 1000:1000 /app/config
    profiles: [""]
    deploy:
      mode: "replicated"
      replicas: 1
      restart_policy:
        condition: none

  jennifer:
    user: "1000:1000"
    image: idacat411/app:latest
    container_name: jennifer
    build:
      context: .
      # no_cache: true
    profiles: [""]
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: '10m'
    volumes:
      - ./config:/app/config/
      - ./config:/app/memgpt_user_data.json
      - ./nltk_data:/home/appuser/nltk_data
    tty: true # enable colorized logs
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  jennifer-text-backend:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    image: lunamidori5/midori_ai_subsystem_localai_nvidia_gpu:master
    pull_policy: always # always pull the latest
    profiles: [""]
    tty: true # enable colorized logs
    restart: always # should this be on-failure ?
    ports:
      - 38079:8080
    env_file:
      - ../.env
    network_mode: localai
    volumes:
      - /var/lib/docker/volumes/midoriai_midori-ai-models/_data:/models
      - /var/lib/docker/volumes/midoriai_midori-ai-images/_data:/tmp/generated/images/
      - /var/lib/docker/volumes/midoriai_midori-ai-audio/_data:/tmp/generated/audio/
    command: ["./local-ai"]

  stable-diffusion-jennifer: &automatic
    # <<: *base_service
    container_name: stable-diffusion-jennifer
    # build: ../services/AUTOMATIC1111
    image: idacat411/stable-diffusion:latest
    restart: unless-stopped
    tty: true
    environment:
      - CLI_ARGS= --allow-code --enable-insecure-extension-access --api --opt-split-attention --xformers
    ports:
      - "${WEBUI_PORT:-7860}:7860"
    volumes:
      - &v1 ../data:/data
      - &v2 ../output:/output
    stop_signal: SIGKILL
    profiles: [""]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [compute, utility]
  download:
    build: ../services/download/
    profiles: ["download",""]
    volumes:
      - *v1
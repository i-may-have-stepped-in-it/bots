name: jennifer

services:
  init:
    image: busybox
    volumes:
      - ./config:/app/config  # Mount the ./config directory on the host to /app/config in the container
    command: chown -R 1000:1000 /app/config
    profiles: ["",nvidia,intel]
    deploy:
      mode: "replicated"
      replicas: 1
      restart_policy:
        condition: none

  jennifer:
    user: "1000:1000"
    image: idacat411/app:latest
    container_name: jennifer
    build:
      context: .
      # no_cache: true
    network_mode: host
    profiles: ["",nvidia,intel]
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: '10m'
    volumes:
      - ./config/:/app/config/
      - ./nltk_data:/home/appuser/nltk_data
    tty: true # enable colorized logs
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [compute, utility]

  jennifer-text-backend-nvidia:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              # device_ids: ['1','2']
              capabilities: [compute, utility]
    image: localai/localai:latest-aio-gpu-nvidia-cuda-13
    pull_policy: always # always pull the latest
    profiles: [nvidia,""]
    tty: true # enable colorized logs
    restart: always # should this be on-failure ?
    # network_mode: host
    privileged: true
    ports:
      - 38078:38078
    env_file:
      - ./.env
    volumes:
      - /var/lib/docker/volumes/midoriai_midori-ai-models/_data:/models:rshared
      - /var/lib/docker/volumes/midoriai_midori-ai-images/_data:/tmp/generated/images/:rshared
      - /var/lib/docker/volumes/midoriai_midori-ai-audio/_data:/tmp/generated/audio/:rshared
      - ./.env:/build/.env
      
    command: [ local-ai ]

  jennifer-text-backend-intel:
    deploy:
    devices:
      - /dev/dri:/dev/dri
    image: lunamidori5/midori_ai_subsystem_localai_intelf16_gpu:master
    tty: true # enable colorized logs
    restart: always # should this be on-failure ?
    profiles: ["intel",""]
    ports:
      - 38078:38078
    privileged: true
    # network_mode: host
    env_file:
      - intel.env
    volumes:
      - /var/lib/docker/volumes/midoriai_midori-ai-models/_data:/models:rshared
      - /var/lib/docker/volumes/midoriai_midori-ai-images/_data:/tmp/generated/images/:rshared
      - /var/lib/docker/volumes/midoriai_midori-ai-audio/_data:/tmp/generated/audio/:rshared
      - ./intel.env:/build/.env
    command: [ "local-ai" ]
  stable-diffusion-jennifer: &automatic
    container_name: stable-diffusion-jennifer
    build: ../services/AUTOMATIC1111
    image: idacat411/stable-diffusion:latest
    restart: unless-stopped
    tty: true
    environment:
      - CLI_ARGS= --allow-code --enable-insecure-extension-access --api --xformers
    ports:
      - "${WEBUI_PORT:-7860}:7860"
    volumes:
      - &v1 ../data:/data
      - &v2 ../output:/output
    stop_signal: SIGKILL
    profiles: ["",intel,nvidia]
    # network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              # device_ids: ['1','2']
              capabilities: [compute, utility]
  download:
    build: ../services/download/
    profiles: ["download",""]
    volumes:
      - *v1
  vllm:
    image: idacat411/vllm-xpu:latest
    container_name: vllm
    build:
      dockerfile: ./vllm/Dockerfile.xpu
    ports:
      - "8050:8000"
    profiles: [vllm]
    volumes:
      - ./hfcache:/root.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [compute, utility]
    command: [
      "--host", "${VLLM_HOST}", "--port", "8000",
      "--gpu-memory-utilization", "${GPU_PERCENTAGE}",
      "--max-model-len", "${MAX_MODEL_LEN}",
      "--model", "${HF_MODEL}"
    ]
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
      HF_MODEL: ${HF_MODEL}
      HF_CACHE_DIR: ${HF_CACHE_DIR}
      VLLM_PORT: ${VLLM_PORT}
      VLLM_HOST: ${VLLM_HOST}
      GPU_PERCENTAGE: ${GPU_PERCENTAGE}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN}
    env_file:
      - ./vllm/.env
  jennifer-text-backend-cpu:
    deploy:
    image: lunamidori5/localai_cpu:master
    tty: true # enable colorized logs
    restart: always # should this be on-failure ?
    profiles: ["auto-cpu",""]
    pull_policy: always # always pull the latest
    ports:
      - 38078:38078
    network_mode: host
    env_file:
      - .env
    volumes:
      - /var/lib/docker/volumes/midoriai_midori-ai-models/_data:/models:rshared
      - /var/lib/docker/volumes/midoriai_midori-ai-images/_data:/tmp/generated/images/:rshared
      - /var/lib/docker/volumes/midoriai_midori-ai-audio/_data:/tmp/generated/audio/:rshared
    command: [ "local-ai" ]